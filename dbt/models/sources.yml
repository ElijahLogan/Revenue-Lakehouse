version: 2

sources:
  - name: silver
    database: revenue
    schema: silver
    tables:
      - name: salesforce_account
        columns:
          - name: account_id
            data_tests: [unique, not_null]

      - name: salesforce_opportunity
        columns:
          - name: opportunity_id
            data_tests: [unique, not_null]

      - name: stripe_customer
        columns:
          - name: customer_id
            data_tests: [unique, not_null]

      - name: stripe_charge
        columns:
          - name: charge_id
            data_tests: [unique, not_null]
          - name: status
            data_tests:
              - accepted_values:
                  values: ["succeeded", "pending", "failed"]